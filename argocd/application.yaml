apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies-dev-gaz
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: network-policies
spec:
  project: default
  source:
    repoURL: https://github.com/pascariucosmin93/k8s-network-policies.git
    targetRevision: HEAD
    path: network-policies/envs/dev/gaz
  destination:
    server: https://kubernetes.default.svc
    namespace: gaz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
