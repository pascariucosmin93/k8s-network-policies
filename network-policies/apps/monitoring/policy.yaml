apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-ingress
    app.kubernetes.io/part-of: network-policies
    app.kubernetes.io/component: platform
    security.cilium.io/profile: zero-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      io.cilium.k8s.policy.serviceaccount: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-loki-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-loki-egress
    app.kubernetes.io/part-of: network-policies
    app.kubernetes.io/component: platform
    security.cilium.io/profile: zero-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      io.cilium.k8s.policy.serviceaccount: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "^/ready$"
              - method: "GET"
                path: "^/loki/api/v1/.*$"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-egress
    app.kubernetes.io/part-of: network-policies
    app.kubernetes.io/component: platform
    security.cilium.io/profile: zero-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      io.cilium.k8s.policy.serviceaccount: prometheus
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
            - port: "10250"
              protocol: TCP
---
