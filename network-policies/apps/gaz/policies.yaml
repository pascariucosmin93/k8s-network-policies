apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gaz-gateway-ingress
  labels:
    app.kubernetes.io/part-of: gaz
    app.kubernetes.io/component: gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gaz-gateway
      io.cilium.k8s.policy.serviceaccount: gaz-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "^/healthz$"
              - method: "GET"
                path: "^/api/v1/quotes(/[0-9A-Za-z_-]+)?$"
              - method: "POST"
                path: "^/api/v1/calculate$"
---
apiVersion: cilium.io/v2
