apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gaz-billing-ingress
  labels:
    app.kubernetes.io/part-of: gaz
    app.kubernetes.io/component: billing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      io.cilium.k8s.policy.serviceaccount: billing-service
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gaz
            k8s:io.cilium.k8s.policy.serviceaccount: gaz-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
