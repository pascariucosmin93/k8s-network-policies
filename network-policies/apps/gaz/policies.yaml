---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gaz-billing-external-egress
  labels:
    app.kubernetes.io/part-of: gaz
    app.kubernetes.io/component: billing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      io.cilium.k8s.policy.serviceaccount: billing-service
  egress:
    - toFQDNs:
        - matchName: api.partner.example.com
        - matchName: oauth.partner.example.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
