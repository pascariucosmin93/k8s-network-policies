apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gaz-gateway-ingress
  labels:
    app.kubernetes.io/name: gaz-gateway-ingress
    app.kubernetes.io/part-of: network-policies
    app.kubernetes.io/component: application
    security.cilium.io/profile: zero-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gaz-gateway
      io.cilium.k8s.policy.serviceaccount: gaz-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "^/healthz$"
              - method: "GET"
                path: "^/api/v1/quotes(/[0-9A-Za-z_-]+)?$"
              - method: "POST"
                path: "^/api/v1/calculate$"
              - method: "POST"
                path: "^/api/v1/invoices$"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gaz-gateway-egress
  labels:
    app.kubernetes.io/name: gaz-gateway-egress
    app.kubernetes.io/part-of: network-policies
    app.kubernetes.io/component: application
    security.cilium.io/profile: zero-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gaz-gateway
      io.cilium.k8s.policy.serviceaccount: gaz-gateway
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gaz
            k8s:app.kubernetes.io/name: calculator
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gaz
            k8s:app.kubernetes.io/name: billing-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "POST"
                path: "^/api/v1/invoices$"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gaz
            k8s:app.kubernetes.io/name: reporting-service
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
