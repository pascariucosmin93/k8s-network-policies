apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gaz-prod

resources:
  - ../../../apps/gaz

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/instance: gaz-prod
      env: prod
      policy-tier: application
patches:
  - target:
      kind: CiliumNetworkPolicy
      name: gaz-gateway-egress
    patch: |-
      - op: replace
        path: /spec/egress/0/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: gaz-prod
      - op: replace
        path: /spec/egress/1/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: gaz-prod
      - op: replace
        path: /spec/egress/2/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: gaz-prod
  - target:
      kind: CiliumNetworkPolicy
      name: gaz-calculator-ingress
    patch: |-
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: gaz-prod
  - target:
      kind: CiliumNetworkPolicy
      name: gaz-billing-ingress
    patch: |-
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: gaz-prod
  - target:
      kind: CiliumNetworkPolicy
      name: gaz-reporting-ingress
    patch: |-
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: gaz-prod
