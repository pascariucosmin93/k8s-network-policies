apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-dev

resources:
  - ../../../apps/monitoring

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/instance: monitoring-dev
      env: dev
      policy-tier: platform
patches:
  - target:
      kind: CiliumNetworkPolicy
      name: grafana-loki-egress
    patch: |-
      - op: replace
        path: /spec/egress/0/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: monitoring-dev
  - target:
      kind: CiliumNetworkPolicy
      name: prometheus-egress
    patch: |-
      - op: replace
        path: /spec/egress/1/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: monitoring-dev
      - op: replace
        path: /spec/egress/2/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: monitoring-dev
